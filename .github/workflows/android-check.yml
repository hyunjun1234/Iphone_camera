name: Android camera checks
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  camera:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Enable emulator acceleration
        run: sudo chmod 666 /dev/kvm
      - name: Build and check
        run: ./gradlew assembleDebug assembleDebugAndroidTest testDebugUnitTest lintDebug --max-workers=2
      - name: Camera tests and screenshots
        uses: ReactiveCircus/android-emulator-runner@4c44018e59b437e86cdfc41da381398f93ed8808 # v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_7
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back virtualscene -camera-front emulated
          script: |
            ./gradlew connectedDebugAndroidTest --max-workers=2
            cp -R app/build/outputs/androidTest-results app/build/full-camera-results
            python3 scripts/capture_emulator_ui.py
            adb shell wm size 1080x2160
            adb shell wm density 480
            adb shell settings put system font_scale 1.3
            ./gradlew connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=studio.moment.camera.CameraUsabilityTest --max-workers=2
      - name: Save test evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: camera-checks
          path: |
            app/build/reports/
            app/build/full-camera-results/
            app/build/outputs/androidTest-results/
            app/build/ui-screenshots/
          retention-days: 14
